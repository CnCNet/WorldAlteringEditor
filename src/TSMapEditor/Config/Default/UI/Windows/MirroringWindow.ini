[MirroringWindow]
$CC0=lblAxesDescription:XNALabel
$CC1=chkNorthSouth:XNACheckBox
$CC2=chkEastWest:XNACheckBox
$CC3=chkNorthEastSouthWest:XNACheckBox
$CC4=chkNorthWestSouthEast:XNACheckBox
$CC5=chkHalfTurn:XNACheckBox
$CC6=lblOffsetHint:XNALabel
$Width=max(350, getRight(lblAxesDescription) + EMPTY_SPACE_SIDES, getRight(lblOffsetHint) + EMPTY_SPACE_SIDES)
$CC7=lblXOffset:XNALabel
$CC8=tbXOffset:EditorNumberTextBox
$CC9=lblYOffset:XNALabel
$CC10=tbYOffset:EditorNumberTextBox
$CC11=btnSelectMirroringPoint:EditorButton
$CC12=btnCenterOfMap:EditorButton
$CC13=btnApply:EditorButton
$CC14=btnCancel:EditorButton
$Height=getBottom(btnApply) + EMPTY_SPACE_BOTTOM

[lblAxesDescription]
$X=EMPTY_SPACE_SIDES
$Y=EMPTY_SPACE_TOP
$Text=translate(Choose mirroring axes. Selected options combine.)

[chkNorthSouth]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(lblAxesDescription) + (VERTICAL_SPACING * 2)
$Text=translate(North-South axis)

[chkEastWest]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkNorthSouth) + VERTICAL_SPACING
$Text=translate(East-West axis)

[chkNorthEastSouthWest]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkEastWest) + VERTICAL_SPACING
$Text=translate(Northeast-Southwest axis)

[chkNorthWestSouthEast]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkNorthEastSouthWest) + VERTICAL_SPACING
$Text=translate(Northwest-Southeast axis)

[chkHalfTurn]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkNorthWestSouthEast) + VERTICAL_SPACING
$Text=translate(Across-center mirroring)

[lblOffsetHint]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkHalfTurn) + EMPTY_SPACE_TOP
$Text=translate(Mirroring point offset:)

[lblXOffset]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(lblOffsetHint) + VERTICAL_SPACING
$Text=translate(X Offset)

[tbXOffset]
$X=getX(lblXOffset)
$Y=getBottom(lblXOffset) + VERTICAL_SPACING
$Width=(getWidth(MirroringWindow) / 2) - EMPTY_SPACE_SIDES - HORIZONTAL_SPACING
AllowDecimals=yes

[lblYOffset]
$X=getWidth(MirroringWindow) / 2
$Y=getY(lblXOffset)
$Text=translate(Y Offset)

[tbYOffset]
$X=getX(lblYOffset)
$Y=getY(tbXOffset)
$Width=getWidth(MirroringWindow) - getX(tbYOffset) - EMPTY_SPACE_SIDES
AllowDecimals=yes

[btnSelectMirroringPoint]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(tbXOffset) + (VERTICAL_SPACING * 2)
$Width=194
$Text=translate(Select Mirroring Point)

[btnCenterOfMap]
$X=getRight(btnSelectMirroringPoint) + HORIZONTAL_SPACING
$Y=getY(btnSelectMirroringPoint)
$Width=getWidth(MirroringWindow) - getX(btnCenterOfMap) - EMPTY_SPACE_SIDES
$Text=translate(Center of Map)

[btnApply]
$Width=100
$X=getWidth(MirroringWindow) - getWidth(btnApply) - EMPTY_SPACE_SIDES
$Y=getBottom(btnSelectMirroringPoint) + EMPTY_SPACE_TOP
$Text=translate(Apply)

[btnCancel]
$Width=100
$X=EMPTY_SPACE_SIDES
$Y=getY(btnApply)
$Text=translate(Cancel)
