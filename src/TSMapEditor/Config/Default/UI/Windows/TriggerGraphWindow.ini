[TriggerGraphWindow]
$Width=RESOLUTION_WIDTH - max(24, RESOLUTION_WIDTH / 32)
$Height=RESOLUTION_HEIGHT - max(40, RESOLUTION_HEIGHT / 24)
$CC0=lblHeader:XNALabel
$CC1=tbSearch:EditorSuggestionTextBox
$CC2=lbNodes:EditorListBox
$CC3=chkFocus:XNACheckBox
$CC4=btnOpenSelected:EditorButton
$CC5=btnRefresh:EditorButton
$CC6=panelGraph:TriggerGraphPanel
$CC7=lblStatus:XNALabel
$CC8=btnZoomIn:EditorButton
$CC9=btnResetZoom:EditorButton
$CC10=btnZoomOut:EditorButton
HasCloseButton=yes

[lblHeader]
$X=EMPTY_SPACE_SIDES
$Y=EMPTY_SPACE_TOP
FontIndex=1
$Text=translate(Trigger Graph)

[tbSearch]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(lblHeader) + VERTICAL_SPACING
Width=260
$Suggestion=translate(Search by name or ID...)

[lbNodes]
$X=getX(tbSearch)
$Y=getBottom(tbSearch) + VERTICAL_SPACING
$Width=getWidth(tbSearch)
$Height=getHeight(TriggerGraphWindow) - getY(lbNodes) - 94

[chkFocus]
$X=getX(lbNodes)
$Y=getBottom(lbNodes) + VERTICAL_SPACING
$Text=translate(Focus on selection)

[btnOpenSelected]
$X=getX(lbNodes)
$Y=getBottom(chkFocus) + VERTICAL_SPACING
Width=124
$Text=translate(Open selected)

[btnRefresh]
$X=getRight(btnOpenSelected) + HORIZONTAL_SPACING
$Y=getY(btnOpenSelected)
$Width=getRight(lbNodes) - getX(btnRefresh)
$Text=translate(Refresh)

[panelGraph]
$X=getRight(lbNodes) + (HORIZONTAL_SPACING * 2)
$Y=getY(tbSearch)
$Width=getWidth(TriggerGraphWindow) - getX(panelGraph) - EMPTY_SPACE_SIDES
$Height=getHeight(TriggerGraphWindow) - getY(panelGraph) - 40

; Graph colors in R,G,B format, with each component between 0 and 255.
TriggerColor=135,192,232
VariableColor=255,0,200
LinkColor=181,154,220
ReadColor=115,211,196
WriteColor=229,162,112
CardBackground=24,31,39
HoveredCardBackground=41,52,63
SelectedCardBackground=93,120,147

[lblStatus]
$X=getX(panelGraph)
$Y=getBottom(panelGraph) + VERTICAL_SPACING

[btnZoomIn]
$X=getRight(panelGraph) - 26 - (EMPTY_SPACE_SIDES * 3)
$Y=getY(lblHeader) - 3
Width=26
$Text=translate(+)

[btnResetZoom]
$X=getX(btnZoomIn) - 60 - HORIZONTAL_SPACING
$Y=getY(btnZoomIn)
Width=60

[btnZoomOut]
$X=getX(btnResetZoom) - 26 - HORIZONTAL_SPACING
$Y=getY(btnZoomIn)
Width=26
$Text=translate(-)
