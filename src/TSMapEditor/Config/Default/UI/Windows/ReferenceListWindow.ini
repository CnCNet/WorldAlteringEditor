[ReferenceListWindow]
$Width=800
$Height=600
$CC0=lblHeader:XNALabel
$CC1=panelReferences:ReferenceListPanel
HasCloseButton=yes

[lblHeader]
FontIndex=1
$X=EMPTY_SPACE_SIDES
$Y=EMPTY_SPACE_TOP
$TextAnchor=HORIZONTAL_CENTER
$AnchorPoint=getWidth(ReferenceListWindow) / 2,EMPTY_SPACE_TOP
Text=Placeholder

[panelReferences]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(lblHeader) + EMPTY_SPACE_TOP
$Width=getWidth(ReferenceListWindow) - (EMPTY_SPACE_SIDES * 2)
$Height=getHeight(ReferenceListWindow) - getY(panelReferences) - EMPTY_SPACE_BOTTOM
