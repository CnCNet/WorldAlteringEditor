[ObjectListWindow]
$Width=900
$Height=630 - max(0, 680 - RESOLUTION_HEIGHT / 2)
$X=EMPTY_SPACE_SIDES
$Y=BUTTON_HEIGHT + EMPTY_SPACE_TOP
CenterByDefault=no
HasCloseButton=yes
$CC0=lblHeader:XNALabel
$CC1=lblCategory:XNALabel
$CC2=ddCategory:XNADropDown
$CC3=lblOwner:XNALabel
$CC4=ddOwner:XNADropDown
$CC5=lbObjects:XNAMultiColumnListBox

[lblHeader]
FontIndex=1
$X=EMPTY_SPACE_SIDES
$Y=EMPTY_SPACE_TOP
$Text=translate(Object List)

[lblCategory]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(lblHeader) + EMPTY_SPACE_TOP
$Text=translate(Category:)

[ddCategory]
Width=165
$X=getRight(lblCategory) + HORIZONTAL_SPACING
$Y=getY(lblCategory)

[lblOwner]
$X=getRight(ddCategory) + EMPTY_SPACE_SIDES
$Y=getY(lblCategory)
$Text=translate(Owner:)

[ddOwner]
Width=195
$X=getRight(lblOwner) + HORIZONTAL_SPACING
$Y=getY(lblOwner)

[lbObjects]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(ddCategory) + VERTICAL_SPACING
$Width=getWidth(ObjectListWindow) - (EMPTY_SPACE_SIDES * 2)
$Height=getHeight(ObjectListWindow) - getY(lbObjects) - EMPTY_SPACE_BOTTOM
$Column0=translate(Type):220
$Column1=translate(Category):110
$Column2=translate(Owner):160
$Column3=translate(X):40
$Column4=translate(Y):40
$Column5=translate(Mission):85
$Column6=translate(Attached Tag):getWidth(lbObjects) - 655
